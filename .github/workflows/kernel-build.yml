name: Kernel Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android 版本'
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
        default: android12
      kernel_version:
        description: 'Kernel 版本'
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
        default: "5.10"
      sub_level:
        description: '内核小版本号（Sub Level）。决定编译哪个分支，必须与 OS Patch Level 配套。可用值：5.10 -> 136/198/209/236/X；5.15 -> 74/123/148/170/178/180；6.1 -> 78/90/99/124/145；6.6 -> 50/66/102'
        required: true
        type: string
        default: '236'
      os_patch_level:
        description: '内核分支日期（OS Patch Level）。决定编译哪个分支，必须与 Sub Level 配套。可用值：5.10 -> 2022-11/2024-01/2024-05/2025-05/lts；5.15 -> 2023-01/2023-11/2024-05/2025-01/2025-03/2025-05；6.1 -> 2024-06/2024-08/2024-10/2025-02/2025-09；6.6 -> 2024-10/2025-02/2025-10'
        required: true
        type: string
        default: '2025-05'
      revision:
        description: 'certified boot 模板的 revision（仅 5.10 需要，5.15/6.1/6.6 留空即可）'
        required: false
        type: string
        default: ''
      kernelsu_version:
        description: 'SukiSU 版本'
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
        default: Stable(标准)
      kernelsu_commit:
        description: '指定 KernelSU commit hash (可选)'
        required: false
        type: string
        default: ''
      susfs_commit:
        description: '指定 SUSFS commit hash'
        required: false
        type: string
        default: ''
      custom_version:
        description: '自定义版本后缀 (可选)。留空则用默认版本名，如 android12-5.10.236-2025-05'
        required: false
        type: string
        default: ''
      use_zram:
        description: '启用 ZRAM (LZ4KD) 内存压缩。与 root / KPM / SUSFS 无关，按需开启'
        required: true
        type: boolean
        default: false
      use_kpm:
        description: '启用 KPM（KernelPatch）。android15-6.6 会自动跳过，详见 README'
        required: true
        type: boolean
        default: true
      BBG:
        description: '启用 Baseband-guard'
        required: true
        type: boolean
        default: false
      supp_op:
        description: '启用 OnePlus 8E 支持'
        required: true
        type: boolean
        default: false
      set_defbbr:
        description: '设置 BBR 为默认拥塞算法'
        required: true
        type: boolean
        default: false
      make_release:
        description: '创建 GitHub Release'
        required: true
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.10'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'
          verbose: 'true'

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          # 内核编译（build/build.sh）需要 bc / bison / flex / libssl-dev /
          # libelf-dev；repo 工具的 shebang 是 `#!/usr/bin/env python`，
          # ubuntu-latest 只有 python3，必须装 python-is-python3 否则
          # repo init 会报 "env: 'python': No such file or directory"。
          # rsync 供 repo sync / 部分 AOSP 脚本使用。
          sudo apt install -y ccache python3 python-is-python3 git curl wget \
            zip unzip bc bison flex libssl-dev libelf-dev rsync
          pip install PyYAML
          # 前置校验：任何一个缺了都不要让构建跑半小时才失败
          python --version
          python3 --version
          for c in bc bison flex gcc make unzip zip gzip; do
            command -v "$c" >/dev/null || { echo "缺少 $c" >&2; exit 1; }
          done
          echo "依赖校验通过"

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}-ccache-

      # AVB 自签 key 是可选的：仅 android12-5.10 / android13-5.15 会产
      # boot*.img（用 Google certified boot 模板 + magiskboot 打包，VBMETA
      # 由模板沿用）；android14-6.1 / android15-6.6 按规则只产 AnyKernel3.zip，
      # 不需要 boot 签名。配置时把 PEM 私钥全文粘进 Secret BOOT_SIGN_KEY。
      - name: Setup AVB signing key (optional)
        if: ${{ (github.event.inputs.android_version == 'android12' && github.event.inputs.kernel_version == '5.10') || (github.event.inputs.android_version == 'android13' && github.event.inputs.kernel_version == '5.15') }}
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
        run: |
          if [ -n "$BOOT_SIGN_KEY" ]; then
            mkdir -p toolchain/linux-x86/bin
            printf '%s\n' "$BOOT_SIGN_KEY" > toolchain/linux-x86/bin/testkey.pem
            echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/toolchain/linux-x86/bin/testkey.pem" >> $GITHUB_ENV
            echo "AVB signing key configured"
          else
            echo "BOOT_SIGN_KEY not set; boot.img will be produced without an AVB footer"
          fi

      # 在下载几十 GB 内核源码之前先校验参数组合合法。
      # 组合非法时 repo init 会报 "manifest project not found" 之类的
      # 迷惑错误，而且已经白下载了一堆工具链。
      - name: Validate build parameters
        run: |
          cd ./.github/workflows/scripts
          python3 validate_params.py \
            --android "${{ github.event.inputs.android_version }}" \
            --kernel "${{ github.event.inputs.kernel_version }}" \
            --sub-level "${{ github.event.inputs.sub_level }}" \
            --os-patch "${{ github.event.inputs.os_patch_level }}"

      - name: Build kernel
        run: |
          cd ./.github/workflows/scripts

          ARGS="--android ${{ github.event.inputs.android_version }}"
          ARGS="$ARGS --kernel ${{ github.event.inputs.kernel_version }}"
          ARGS="$ARGS --sub-level ${{ github.event.inputs.sub_level }}"
          ARGS="$ARGS --os-patch ${{ github.event.inputs.os_patch_level }}"
          [ -n "${{ github.event.inputs.revision }}" ] && ARGS="$ARGS --revision ${{ github.event.inputs.revision }}"
          ARGS="$ARGS --ksu-version ${{ github.event.inputs.kernelsu_version }}"

          [ "${{ github.event.inputs.use_zram }}" = "true" ] && ARGS="$ARGS --zram"
          [ "${{ github.event.inputs.use_kpm }}" = "false" ] && ARGS="$ARGS --no-kpm"
          [ "${{ github.event.inputs.BBG }}" = "true" ] && ARGS="$ARGS --bbg"
          [ "${{ github.event.inputs.supp_op }}" = "true" ] && ARGS="$ARGS --op8e"
          [ "${{ github.event.inputs.set_defbbr }}" = "true" ] && ARGS="$ARGS --bbr"
          [ -z "${{ github.event.inputs.kernelsu_commit }}" ] || ARGS="$ARGS --ksu-commit=${{ github.event.inputs.kernelsu_commit }}"
          [ -z "${{ github.event.inputs.susfs_commit }}" ] || ARGS="$ARGS --susfs-commit=${{ github.event.inputs.susfs_commit }}"
          [ -z "${{ github.event.inputs.custom_version }}" ] || ARGS="$ARGS --custom-version=${{ github.event.inputs.custom_version }}"
          [ "${{ github.event.inputs.make_release }}" = "true" ] || ARGS="$ARGS --no-release"

          python3 build.py $ARGS

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          find /tmp/gki-build -name "*.zip" -type f -exec cp {} artifacts/ \;
          find /tmp/gki-build -name "*.img" -type f -exec cp {} artifacts/ \;
          find /tmp/gki-build -name "BUILD_MANIFEST.txt" -type f -exec cp {} artifacts/ \;
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "没有找到构建产物，构建失败" >&2
            exit 1
          fi
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}
          path: artifacts/*

      - name: Generate checksums
        run: |
          echo "=== Creating checksums ==="
          sha256sum artifacts/* > SHA256SUMS.txt
          cat SHA256SUMS.txt
